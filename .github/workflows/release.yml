name: Release macOS packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.artifact_arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact_arch: arm64
          - runner: macos-15-intel
            artifact_arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "error: tag ${GITHUB_REF_NAME} must equal v${version}" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Build native release binary
        run: MACOSX_DEPLOYMENT_TARGET=13.0 cargo build --release --locked
      - name: Verify native binary architecture
        shell: bash
        run: |
          set -euo pipefail
          architectures="$(lipo -archs target/release/truck-ledger)"
          [[ "$architectures" == "${{ matrix.artifact_arch }}" ]] || { echo "error: expected ${{ matrix.artifact_arch }}, found $architectures" >&2; exit 1; }
      - name: Build and validate unsigned package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          ./packaging/macos/build-pkg.sh --output-dir release-artifacts
          package="release-artifacts/truck-ledger-$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')-macos-${{ matrix.artifact_arch }}.pkg"
          ./packaging/macos/validate-pkg.sh --pkg "$package" --min-macos 13.0
      - name: Create final checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"
          package="release-artifacts/truck-ledger-${version}-macos-${{ matrix.artifact_arch }}.pkg"
          shasum -a 256 "$package" > "$package.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: truck-ledger-${{ matrix.artifact_arch }}
          path: release-artifacts/
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "error: tag ${GITHUB_REF_NAME} must equal v${version}" >&2; exit 1; }
          for architecture in arm64 x86_64; do
            package="release-artifacts/truck-ledger-${version}-macos-${architecture}.pkg"
            [[ -f "$package" && -f "$package.sha256" ]] || { echo "error: missing final release artifact for $architecture" >&2; exit 1; }
            (cd release-artifacts && shasum -a 256 -c "$(basename "$package").sha256")
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"
          gh release create "v${version}" release-artifacts/* --title "v${version}" --generate-notes
