name: Release macOS packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.artifact_arch }} package
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact_arch: arm64
          - runner: macos-15-intel
            artifact_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"

          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} must equal v${version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build debug
        run: cargo build --locked

      - name: Build native release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --locked

      - name: Verify native binary architecture
        shell: bash
        run: |
          set -euo pipefail

          architectures="$(lipo -archs target/release/truck-ledger)"

          if [[ "$architectures" != "${{ matrix.artifact_arch }}" ]]; then
            echo "error: expected ${{ matrix.artifact_arch }}, found $architectures" >&2
            exit 1
          fi

      - name: Build and validate unsigned package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          ./packaging/macos/build-pkg.sh \
            --output-dir release-artifacts

          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"

          package="release-artifacts/truck-ledger-${version}-macos-${{ matrix.artifact_arch }}.pkg"

          ./packaging/macos/validate-pkg.sh \
            --pkg "$package" \
            --min-macos 13.0

      - name: Create final checksum
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[#@]//')"
          package="release-artifacts/truck-ledger-${version}-macos-${{ matrix.artifact_arch }}.pkg"

          (
            cd release-artifacts
            shasum -a 256 "$(basename "$package")" > "$(basename "$package").sha256"
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truck-ledger-${{ matrix.artifact_arch }}
          path: release-artifacts/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          for architecture in arm64 x86_64; do
            package="release-artifacts/truck-ledger-${version}-macos-${architecture}.pkg"
            checksum="${package}.sha256"

            if [[ ! -f "$package" ]]; then
              echo "error: missing release package for $architecture: $package" >&2
              exit 1
            fi

            if [[ ! -f "$checksum" ]]; then
              echo "error: missing checksum for $architecture: $checksum" >&2
              exit 1
            fi

            (
              cd release-artifacts
              sha256sum -c "truck-ledger-${version}-macos-${architecture}.pkg.sha256"
            )
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          gh release create "v${version}" \
            release-artifacts/truck-ledger-${version}-macos-arm64.pkg \
            release-artifacts/truck-ledger-${version}-macos-arm64.pkg.sha256 \
            release-artifacts/truck-ledger-${version}-macos-x86_64.pkg \
            release-artifacts/truck-ledger-${version}-macos-x86_64.pkg.sha256 \
            --title "v${version}" \
            --generate-notes