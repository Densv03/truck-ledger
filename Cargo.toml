[package]
name = "truck-ledger"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local hired-driver history and analytics for Euro Truck Simulator 2."

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
sii-decode-rs = { git = "https://github.com/fangyi-zhou/sii-decode-rs", rev = "f65cc2f68401e74cfb7c1aae497d196c79d051a7" }

[dev-dependencies]
tempfile = "3.23.0"
