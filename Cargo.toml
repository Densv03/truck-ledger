[package]
name = "truck-ledger"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local hired-driver history and analytics for Euro Truck Simulator 2."

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
sii-decode-rs = { path = "vendor/sii-decode-rs" }
notify = "8.2.0"
walkdir = "2.5.0"
tempfile = "3.23.0"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
